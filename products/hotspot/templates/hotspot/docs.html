<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ doc_description }}">
    <meta name="keywords" content="{{ doc_keywords }}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ canonical_url }}">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ doc_description }}">
    <meta property="og:site_name" content="Hotspot">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page_title }}">
    <meta name="twitter:description" content="{{ doc_description }}">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232563EB' stroke-width='3.5'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%233B82F6' stroke-width='1.75' stroke-dasharray='3 2'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%2310B981'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%23FFFFFF'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Satisfy&display=swap" rel="stylesheet">
    
    <!-- Structured Data for Search Engines -->
    <script type="application/ld+json">{{ doc_json_ld|safe }}</script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Hotspot",
          "item": "{{ site_url }}/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Docs",
          "item": "{{ site_url }}/docs/"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "{{ doc_nav_label }}",
          "item": "{{ canonical_url }}"
        }
      ]
    }
    </script>

    <style>
        :root {
            --brand: #2563EB;
            --brand-hover: #1D4ED8;
            --brand-soft: rgba(37, 99, 235, 0.08);
            --brand-border: #BFDBFE;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --border: #E2E8F0;
            --border-hover: #CBD5E1;
            --text: #0F172A;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --code-bg: #0F172A;
            --code-text: #F8FAFC;
            --success: #10B981;
            --success-soft: #ECFDF5;
            --warn: #F59E0B;
            --warn-soft: #FFFBEB;
            --danger: #EF4444;
            --danger-soft: #FEF2F2;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --sidebar-width: 290px;
            --header-height: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Header */
        .docs-header {
            position: sticky;
            top: 0;
            z-index: 50;
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            color: var(--text);
        }

        .logo-cursive {
            font-family: 'Satisfy', cursive;
            font-size: 2.05rem;
            font-weight: 400;
            line-height: 1;
            display: inline-flex;
            align-items: center;
        }

        .logo-cursive .brand-ring {
            width: 0.62em;
            height: 0.62em;
            margin: 0 0.02em 0 0.04em;
            display: inline-flex;
        }

        .logo-cursive svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .docs-badge {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--brand-soft);
            color: var(--brand);
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
            border: 1px solid var(--brand-border);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .header-link {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.45rem 0.8rem;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .header-link:hover {
            color: var(--text);
            background: var(--border);
        }

        .btn-dash {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.86rem;
            font-weight: 600;
            background: var(--brand);
            color: #FFFFFF;
            text-decoration: none;
            padding: 0.45rem 0.95rem;
            border-radius: 6px;
            box-shadow: 0 1px 3px rgba(37, 99, 235, 0.25);
            transition: background 0.15s ease;
        }

        .btn-dash:hover {
            background: var(--brand-hover);
        }

        /* Mobile Menu Toggle */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: 1px solid var(--border);
            padding: 0.45rem 0.65rem;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text);
        }

        /* Layout Container */
        .docs-container {
            display: flex;
            max-width: 1480px;
            margin: 0 auto;
            min-height: calc(100vh - var(--header-height));
        }

        /* Sidebar */
        .docs-sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem 3rem 1.25rem;
            overflow-y: auto;
            height: calc(100vh - var(--header-height));
            position: sticky;
            top: var(--header-height);
        }

        .sidebar-search {
            margin-bottom: 1.25rem;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.5rem 0.75rem 0.5rem 2.1rem;
            font-size: 0.84rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s ease;
        }

        .search-box input:focus {
            border-color: var(--brand);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .search-icon {
            position: absolute;
            left: 0.65rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .sidebar-cat {
            margin-bottom: 1.5rem;
        }

        .sidebar-cat-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.55rem;
            padding-left: 0.5rem;
        }

        .sidebar-list {
            list-style: none;
        }

        .sidebar-item {
            margin-bottom: 0.15rem;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.45rem 0.65rem;
            border-radius: 6px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.12s ease;
        }

        .sidebar-link:hover {
            color: var(--text);
            background: var(--bg);
        }

        .sidebar-link.active {
            color: var(--brand);
            background: var(--brand-soft);
            font-weight: 600;
        }

        .badge-pill {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
            text-transform: uppercase;
            background: var(--border);
            color: var(--text-secondary);
        }

        .badge-pill.new { background: #DCFCE7; color: #15803D; }
        .badge-pill.core { background: #DBEAFE; color: #1D4ED8; }
        .badge-pill.api { background: #F3E8FF; color: #7E22CE; }
        .badge-pill.popular { background: #FEF3C7; color: #B45309; }

        /* Main Content */
        .docs-main {
            flex: 1;
            min-width: 0;
            padding: 2.5rem 3.5rem 5rem 3.5rem;
            background: #FFFFFF;
        }

        .docs-breadcrumbs {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .docs-breadcrumbs a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .docs-breadcrumbs a:hover {
            color: var(--brand);
        }

        .doc-header {
            margin-bottom: 2.25rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .doc-title {
            font-size: 2.35rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 0.75rem;
        }

        .doc-desc {
            font-size: 1.15rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .doc-lead {
            font-size: 1.12rem;
            line-height: 1.65;
            color: var(--text-secondary);
            margin-bottom: 1.75rem;
        }

        /* Typography inside article */
        .doc-article h2 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            margin: 2.25rem 0 0.85rem;
            padding-bottom: 0.45rem;
            border-bottom: 1px solid var(--border);
        }

        .doc-article h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            margin: 1.5rem 0 0.6rem;
        }

        .doc-article p {
            font-size: 0.98rem;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            line-height: 1.7;
        }

        .doc-article strong {
            color: var(--text);
        }

        .doc-article code {
            font-family: var(--font-mono);
            font-size: 0.86em;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            color: #1E293B;
        }

        .doc-list, .doc-ordered-list {
            margin: 0.85rem 0 1.5rem 1.5rem;
            color: var(--text-secondary);
        }

        .doc-list li, .doc-ordered-list li {
            margin-bottom: 0.5rem;
            line-height: 1.65;
        }

        /* Callouts */
        .callout {
            display: flex;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin: 1.75rem 0;
            border: 1px solid;
            font-size: 0.94rem;
            line-height: 1.6;
        }

        .callout.tip {
            background: #F0FDF4;
            border-color: #BBF7D0;
            color: #166534;
        }

        .callout.note {
            background: #EFF6FF;
            border-color: #BFDBFE;
            color: #1E40AF;
        }

        .callout-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* Code Blocks */
        .code-block-wrap {
            margin: 1.4rem 0 1.75rem;
            background: var(--code-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1E293B;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1E293B;
            padding: 0.55rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.76rem;
            color: #94A3B8;
        }

        .doc-copy-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #E2E8F0;
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
            font-size: 0.72rem;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .doc-copy-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #FFFFFF;
        }

        .code-block-wrap pre {
            padding: 1.1rem 1.25rem;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.88rem;
            line-height: 1.6;
            color: var(--code-text);
        }

        .code-block-wrap code {
            background: none;
            border: none;
            padding: 0;
            color: inherit;
        }

        /* Tables */
        .doc-table-wrap {
            width: 100%;
            overflow-x: auto;
            margin: 1.5rem 0 2rem;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .doc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            text-align: left;
        }

        .doc-table th {
            background: var(--bg);
            padding: 0.75rem 1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        .doc-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .doc-table tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
        }

        .badge.success { background: #DCFCE7; color: #166534; }
        .badge.danger { background: #FEE2E2; color: #991B1B; }
        .badge.neutral { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }

        /* Steps */
        .doc-steps {
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .doc-step {
            display: flex;
            gap: 1rem;
            padding: 1rem 1.25rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .doc-step-num {
            width: 32px;
            height: 32px;
            background: var(--brand);
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .doc-step-body h3 {
            margin: 0 0 0.35rem 0;
            font-size: 1.05rem;
        }

        .doc-step-body p {
            margin: 0;
            font-size: 0.92rem;
        }

        /* Next / Prev Navigation Cards */
        .doc-footer-nav {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .doc-nav-card {
            display: flex;
            flex-direction: column;
            padding: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .doc-nav-card:hover {
            border-color: var(--brand);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
            transform: translateY(-1px);
        }

        .doc-nav-sub {
            font-size: 0.74rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .doc-nav-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--brand);
        }

        .doc-nav-card.next {
            text-align: right;
            grid-column: 2;
        }

        /* Mobile Responsive */
        @media (max-width: 960px) {
            .mobile-menu-btn { display: block; }
            .docs-sidebar {
                position: fixed;
                left: -100%;
                top: var(--header-height);
                z-index: 40;
                width: 280px;
                transition: left 0.25s ease;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            }
            .docs-sidebar.open { left: 0; }
            .docs-main { padding: 1.5rem 1rem 3rem 1rem; }
            .doc-title { font-size: 1.85rem; }
            .doc-footer-nav { grid-template-columns: 1fr; }
            .doc-nav-card.next { grid-column: 1; text-align: left; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="docs-header">
        <div class="header-left">
            <button class="mobile-menu-btn" id="btnToggleSidebar" type="button" aria-label="Toggle Docs Sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <a class="logo-wrap" href="/" title="Hotspot Home">
                <span class="logo-cursive">
                    <span class="brand-h">H</span><span class="brand-ring">
                        <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="13" cy="13" r="11" stroke="#2563EB" stroke-width="2.75"/>
                            <circle cx="13" cy="13" r="6.25" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2.5 1.5"/>
                            <circle cx="13" cy="13" r="3.75" fill="#10B981"/>
                            <circle cx="13" cy="13" r="1.5" fill="#FFFFFF"/>
                        </svg>
                    </span><span class="brand-tail">tspot</span>
                </span>
                <span class="docs-badge">Docs</span>
            </a>
        </div>

        <nav class="header-nav">
            <a class="header-link" href="/demo/">Live Demo</a>
            <a class="header-link" href="/connect/">Agent Connect</a>
            <a class="btn-dash" href="/dashboard/">
                Dashboard
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
        </nav>
    </header>

    <!-- Docs Layout -->
    <div class="docs-container">
        
        <!-- Sidebar Navigation -->
        <aside class="docs-sidebar" id="docsSidebar">
            <div class="sidebar-search">
                <div class="search-box">
                    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="search" id="sidebarSearch" placeholder="Search documentation..." autocomplete="off">
                </div>
            </div>

            <nav aria-label="Documentation Sidebar">
                {{ sidebar_html|safe }}
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="docs-main">
            <!-- Breadcrumbs -->
            <div class="docs-breadcrumbs">
                <a href="/">Hotspot</a>
                <span>&rsaquo;</span>
                <a href="/docs/">Docs</a>
                <span>&rsaquo;</span>
                <span>{{ doc_category_name }}</span>
                <span>&rsaquo;</span>
                <span style="color: var(--text);">{{ doc_nav_label }}</span>
            </div>

            <!-- Page Header -->
            <header class="doc-header">
                <h1 class="doc-title">{{ doc_title }}</h1>
                <p class="doc-desc">{{ doc_description }}</p>
            </header>

            <!-- Semantic Document Content -->
            <article class="doc-article">
                {{ doc_content|safe }}
            </article>

            <!-- Next & Previous Navigation -->
            <div class="doc-footer-nav">
                {{ prev_nav_card|safe }}
                {{ next_nav_card|safe }}
            </div>
        </main>
    </div>

    <script nonce="{{ csp_nonce }}">
        // Copy button behavior
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('.doc-copy-btn');
            if (!btn) return;
            var targetId = btn.getAttribute('data-copy-target');
            var el = document.getElementById(targetId);
            if (!el) return;
            var text = el.textContent || el.innerText;
            navigator.clipboard.writeText(text).then(function () {
                var prevText = btn.textContent;
                btn.textContent = 'Copied!';
                btn.style.background = '#15803D';
                btn.style.color = '#FFFFFF';
                setTimeout(function () {
                    btn.textContent = prevText;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            });
        });

        // Mobile drawer toggle
        var toggleBtn = document.getElementById('btnToggleSidebar');
        var sidebar = document.getElementById('docsSidebar');
        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener('click', function () {
                sidebar.classList.toggle('open');
            });
        }

        // Live sidebar search filter
        var searchInput = document.getElementById('sidebarSearch');
        if (searchInput) {
            searchInput.addEventListener('input', function (e) {
                var q = e.target.value.toLowerCase().trim();
                var items = document.querySelectorAll('.sidebar-item');
                items.forEach(function (item) {
                    var text = item.textContent.toLowerCase();
                    item.style.display = (!q || text.indexOf(q) !== -1) ? 'block' : 'none';
                });
                var cats = document.querySelectorAll('.sidebar-cat');
                cats.forEach(function (cat) {
                    var visibleItems = cat.querySelectorAll('.sidebar-item[style="display: block;"], .sidebar-item:not([style*="display: none"])');
                    cat.style.display = (!q || visibleItems.length > 0) ? 'block' : 'none';
                });
            });
        }
    </script>
</body>
</html>
