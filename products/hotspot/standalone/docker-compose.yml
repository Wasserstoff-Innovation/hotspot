services:
  hotspot:
    build:
      context: ../../..
      dockerfile: products/hotspot/standalone/Dockerfile
    ports:
      - "8000:8000"
    environment:
      HOTSPOT_SITE_URL: ${HOTSPOT_SITE_URL:-http://localhost:8000}
      HOTSPOT_API_KEYS: ${HOTSPOT_API_KEYS:-}
      HOTSPOT_DASHBOARD_PASSWORD: ${HOTSPOT_DASHBOARD_PASSWORD:-}
      HOTSPOT_SECRET_KEY: ${HOTSPOT_SECRET_KEY:-}
      HOTSPOT_CONVERSION_EVENTS: ${HOTSPOT_CONVERSION_EVENTS:-}
      HOTSPOT_REPLAY_ENABLED: ${HOTSPOT_REPLAY_ENABLED:-1}
      HOTSPOT_MAX_RECORDING_BYTES: ${HOTSPOT_MAX_RECORDING_BYTES:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hotspot-redis:/data
    restart: unless-stopped

volumes:
  hotspot-redis:
